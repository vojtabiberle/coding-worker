default_profile = "glm"

# Replace model IDs with values available in `opencode models`.
# "build" is built in. Use "worker" if you already configured that agent.
[profiles.glm]
engine = "opencode"
model = "greenpt/glm-5.3"
agent = "build"
max_steps = 50

[profiles.glm-flash]
engine = "opencode"
model = "greenpt/glm-5.3-flash"
agent = "build"
max_steps = 80

[profiles.deepseek]
engine = "opencode"
model = "greenpt/deepseek-v4.1-flash"
agent = "build"
max_steps = 60

# Optional Pi backend; replace with an exact model ID from `pi --list-models`.
# Pi 0.78.1 only; `agent` is intentionally omitted.
# [profiles.pi]
# engine = "pi"
# model = "anthropic/REPLACE_WITH_EXACT_MODEL_ID"
# max_steps = 30
