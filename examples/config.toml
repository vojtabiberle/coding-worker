default_profile = "pi-deepseek"

# Pi is the default backend: profiles without `engine` use Pi 0.78.1.
# Replace model IDs with exact values from `pi --list-models`; Pi takes no `agent`.
[profiles.pi-deepseek]
model = "greenpt/deepseek-v4.1-flash"
max_steps = 60

[profiles.pi-glm]
model = "greenpt/glm-5.3"
max_steps = 50

# Optional OpenCode backend; replace model IDs with values from `opencode models`.
# "build" is built in. Use "worker" if you already configured that agent.
[profiles.deepseek]
engine = "opencode"
model = "greenpt/deepseek-v4.1-flash"
agent = "build"
max_steps = 60
